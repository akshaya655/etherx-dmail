services:
  - type: web
    name: dmail-secure
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PINATA_JWT
        sync: false
      - key: MAIL_DOMAIN
        value: etherxinnovations.in
      - key: SMTP_DOMAIN
        value: etherxinnovations.in
      - key: SMTP_FROM
        value: "DMail <noreply@etherxinnovations.in>"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: true
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: IMAP_HOST
        value: imap.gmail.com
      - key: IMAP_PORT
        value: 993
      - key: IMAP_USER
        sync: false
      - key: IMAP_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        value: "*"
    healthCheckPath: /health
